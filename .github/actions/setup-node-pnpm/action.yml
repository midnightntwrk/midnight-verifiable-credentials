name: Setup Node and pnpm
description: Setup Node.js 24, optionally install pnpm dependencies, and optionally restore the Turbo cache.

inputs:
  install:
    description: Run pnpm install after setting up Node.js.
    required: false
    default: "true"
  turbo-cache:
    description: Restore the repository Turbo cache for the current job.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.23.0
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Restore turbo cache
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@v4
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ github.job }}-
          ${{ runner.os }}-turbo-
