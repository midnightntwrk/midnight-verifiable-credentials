name: Restore Compact toolchain
description: Download, restore, activate, and verify the prepared Compact toolchain artifact.

inputs:
  compact-version:
    description: Compact compiler version to activate if the restored artifact is not already on PATH.
    required: true

runs:
  using: composite
  steps:
    - name: Download Compact toolchain artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: compact-toolchain
        path: ${{ runner.temp }}/compact-toolchain

    - name: Restore Compact toolchain
      shell: bash
      run: |
        mkdir -p "$HOME/.local/bin" "$HOME/.local/share" "$HOME/.config" "$HOME/.compact"
        tar -C "$HOME" -xzf "$RUNNER_TEMP/compact-toolchain/compact-toolchain.tar.gz"
        sudo ln -sfn "$HOME/.local/bin/compact" /usr/local/bin/compact

    - name: Activate Compact compiler
      shell: bash
      env:
        COMPACT_VERSION_INPUT: ${{ inputs.compact-version }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        if compact compile --version >/dev/null 2>&1; then
          exit 0
        fi
        compact_version="$COMPACT_VERSION_INPUT"
        if [ -z "$compact_version" ]; then
          echo "compact-version input is required" >&2
          exit 1
        fi
        if [ "$compact_version" = "latest" ]; then
          compact update
        else
          compact update "$compact_version" || compact update
        fi

    - name: Verify Compact installation
      shell: bash
      run: compact compile --version
