name: Setup Node and npm
description: Setup Node.js 24, optionally install npm dependencies, and optionally restore the Turbo cache.

inputs:
  install:
    description: Run npm ci after setting up Node.js.
    required: false
    default: "true"
  turbo-cache:
    description: Restore the repository Turbo cache for the current job.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: npm ci --prefer-offline

    - name: Restore turbo cache
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@v4
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('package-lock.json', 'turbo.json') }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ github.job }}-
          ${{ runner.os }}-turbo-
