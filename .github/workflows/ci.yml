name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  COMPACT_COMPILER_VERSION: 0.30.0
  PROOF_SERVER_IMAGE: ${{ vars.PROOF_SERVER_IMAGE != '' && vars.PROOF_SERVER_IMAGE || 'midnightntwrk/proof-server:8.0.3' }}

jobs:
  prepare-compact:
    name: Prepare Compact Toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Compact toolchain
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Verify Compact installation
        run: compact compile --version

      - name: Pack Compact toolchain
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/compact-toolchain"
          compact_paths=(.local/bin/compact)
          if [ -d "$HOME/.local/share/compact" ]; then
            compact_paths+=(.local/share/compact)
          fi
          if [ -d "$HOME/.config/compact" ]; then
            compact_paths+=(.config/compact)
          fi
          tar -C "$HOME" -czf "$RUNNER_TEMP/compact-toolchain/compact-toolchain.tar.gz" "${compact_paths[@]}"

      - name: Upload Compact toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: compact-toolchain
          path: ${{ runner.temp }}/compact-toolchain/compact-toolchain.tar.gz
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: prepare-compact
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Compact toolchain artifact
        uses: actions/download-artifact@v4
        with:
          name: compact-toolchain
          path: ${{ runner.temp }}/compact-toolchain

      - name: Restore Compact toolchain
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share" "$HOME/.config"
          tar -C "$HOME" -xzf "$RUNNER_TEMP/compact-toolchain/compact-toolchain.tar.gz"
          mkdir -p "$HOME/.local/share" "$HOME/.config"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Activate Compact compiler
        shell: bash
        run: |
          if [ "$COMPACT_COMPILER_VERSION" = "latest" ]; then
            compact update || true
          else
            compact update "$COMPACT_COMPILER_VERSION" || compact update || true
          fi

      - name: Verify Compact installation
        run: |
          compact compile --version

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('package-lock.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
            ${{ runner.os }}-turbo-

      - name: Run lint lane
        run: npm run ci:lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: prepare-compact
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Compact toolchain artifact
        uses: actions/download-artifact@v4
        with:
          name: compact-toolchain
          path: ${{ runner.temp }}/compact-toolchain

      - name: Restore Compact toolchain
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share" "$HOME/.config"
          tar -C "$HOME" -xzf "$RUNNER_TEMP/compact-toolchain/compact-toolchain.tar.gz"
          mkdir -p "$HOME/.local/share" "$HOME/.config"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Activate Compact compiler
        shell: bash
        run: |
          if [ "$COMPACT_COMPILER_VERSION" = "latest" ]; then
            compact update || true
          else
            compact update "$COMPACT_COMPILER_VERSION" || compact update || true
          fi

      - name: Verify Compact installation
        run: |
          compact compile --version

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('package-lock.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
            ${{ runner.os }}-turbo-

      - name: Run typecheck lane
        run: npm run ci:typecheck

  package-tests:
    name: Build and Package Tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: prepare-compact
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Compact toolchain artifact
        uses: actions/download-artifact@v4
        with:
          name: compact-toolchain
          path: ${{ runner.temp }}/compact-toolchain

      - name: Restore Compact toolchain
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share" "$HOME/.config"
          tar -C "$HOME" -xzf "$RUNNER_TEMP/compact-toolchain/compact-toolchain.tar.gz"
          mkdir -p "$HOME/.local/share" "$HOME/.config"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Activate Compact compiler
        shell: bash
        run: |
          if [ "$COMPACT_COMPILER_VERSION" = "latest" ]; then
            compact update || true
          else
            compact update "$COMPACT_COMPILER_VERSION" || compact update || true
          fi

      - name: Verify Compact installation
        run: |
          compact compile --version

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('package-lock.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
            ${{ runner.os }}-turbo-

      - name: Run package build and test lane
        run: npm run ci:package-tests

  revocation:
    name: Revocation Demo Lane
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: prepare-compact
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Compact toolchain artifact
        uses: actions/download-artifact@v4
        with:
          name: compact-toolchain
          path: ${{ runner.temp }}/compact-toolchain

      - name: Restore Compact toolchain
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share" "$HOME/.config"
          tar -C "$HOME" -xzf "$RUNNER_TEMP/compact-toolchain/compact-toolchain.tar.gz"
          mkdir -p "$HOME/.local/share" "$HOME/.config"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Activate Compact compiler
        shell: bash
        run: |
          if [ "$COMPACT_COMPILER_VERSION" = "latest" ]; then
            compact update || true
          else
            compact update "$COMPACT_COMPILER_VERSION" || compact update || true
          fi

      - name: Verify Compact installation
        run: |
          compact compile --version

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('package-lock.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
            ${{ runner.os }}-turbo-

      - name: Run revocation-focused lane
        run: npm run ci:revocation

  integration-demo-contract:
    name: "Standalone Integration: Demo Contract"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: prepare-compact
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Compact toolchain artifact
        uses: actions/download-artifact@v4
        with:
          name: compact-toolchain
          path: ${{ runner.temp }}/compact-toolchain

      - name: Restore Compact toolchain
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share" "$HOME/.config"
          tar -C "$HOME" -xzf "$RUNNER_TEMP/compact-toolchain/compact-toolchain.tar.gz"
          mkdir -p "$HOME/.local/share" "$HOME/.config"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Activate Compact compiler
        shell: bash
        run: |
          if [ "$COMPACT_COMPILER_VERSION" = "latest" ]; then
            compact update || true
          else
            compact update "$COMPACT_COMPILER_VERSION" || compact update || true
          fi

      - name: Verify Compact installation
        run: |
          compact compile --version

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run demo-contract integration lane
        run: npm run ci:integration:demo-contract

  integration-protocol:
    name: "Standalone Integration: Protocol"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: prepare-compact
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Compact toolchain artifact
        uses: actions/download-artifact@v4
        with:
          name: compact-toolchain
          path: ${{ runner.temp }}/compact-toolchain

      - name: Restore Compact toolchain
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share" "$HOME/.config"
          tar -C "$HOME" -xzf "$RUNNER_TEMP/compact-toolchain/compact-toolchain.tar.gz"
          mkdir -p "$HOME/.local/share" "$HOME/.config"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Activate Compact compiler
        shell: bash
        run: |
          if [ "$COMPACT_COMPILER_VERSION" = "latest" ]; then
            compact update || true
          else
            compact update "$COMPACT_COMPILER_VERSION" || compact update || true
          fi

      - name: Verify Compact installation
        run: |
          compact compile --version

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run protocol integration lane
        run: npm run ci:integration:protocol
