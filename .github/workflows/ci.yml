name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  COMPACT_COMPILER_VERSION: 0.30.0
  PROOF_SERVER_IMAGE: ${{ vars.PROOF_SERVER_IMAGE != '' && vars.PROOF_SERVER_IMAGE || 'midnightntwrk/proof-server:8.0.3' }}

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      bdd_only: ${{ steps.classify.outputs.bdd_only }}
      run_revocation: ${{ steps.classify.outputs.run_revocation }}
      run_integration_demo_contract: ${{ steps.classify.outputs.run_integration_demo_contract }}
      run_integration_protocol: ${{ steps.classify.outputs.run_integration_protocol }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify docs-only, BDD-only, and heavy-lane changes
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            range="${{ github.event.before }}...${{ github.sha }}"
          else
            range="${{ github.sha }}^...${{ github.sha }}"
          fi

          mapfile -t changed_files < <(git diff --name-only "$range")

          if [[ ${#changed_files[@]} -eq 0 ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "bdd_only=false" >> "$GITHUB_OUTPUT"
            echo "run_revocation=false" >> "$GITHUB_OUTPUT"
            echo "run_integration_demo_contract=false" >> "$GITHUB_OUTPUT"
            echo "run_integration_protocol=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          docs_related=false
          bdd_only=true
          bdd_related=false
          run_revocation=false
          run_integration_demo_contract=false
          run_integration_protocol=false

          matches_any() {
            local file="$1"
            shift
            local pattern
            for pattern in "$@"; do
              if [[ "$file" == $pattern ]]; then
                return 0
              fi
            done
            return 1
          }

          # Keep these pattern sets in sync with the heavy lane jobs below.
          global_heavy_lane_patterns=(
            '.github/workflows/*'
            'components/integration/infrastructure/*'
            'libs/*'
            'package.json'
            'package-lock.json'
            'turbo.json'
            'tsconfig*.json'
            '.eslintrc.json'
            'run.sh'
            'run-credentials.sh'
            'run-credentials-standalone.sh'
            'tooling/*'
          )

          revocation_patterns=(
            'credentials/*'
            'credentials-status-registry/*'
            'credentials-same-holder/*'
            'credentials-birth/*'
            'credentials-birth-secret/*'
            'use-cases/*/contract/*'
          )

          integration_demo_contract_patterns=(
            'credentials/*'
            'credentials-birth/*'
            'credentials-birth-secret/*'
            'use-cases/*/contract/*'
            'components/integration/standalone-environment/*'
          )

          integration_protocol_patterns=(
            'credentials/*'
            'credentials-same-holder/*'
            'credentials-birth/*'
            'credentials-birth-secret/*'
            'use-cases/*/contract/*'
            'components/orchestration/protocol/*'
            'components/integration/standalone-environment/*'
          )

          for file in "${changed_files[@]}"; do
            case "$file" in
              *.md|docs/*)
                docs_related=true
                ;;
              *)
                docs_only=false
                ;;
            esac

            case "$file" in
              use-cases/*/scenarios/*|docs/plans/serenity-js-bdd-layer.md|docs/testing/test-strategy.md|docs/testing/test-matrix.md|docs/README.md|package.json|package-lock.json|run.sh|run-credentials.sh)
                ;;
              *)
                bdd_only=false
                ;;
            esac

            case "$file" in
              use-cases/*/scenarios/*|docs/plans/serenity-js-bdd-layer.md|run.sh|run-credentials.sh)
                bdd_related=true
                ;;
            esac

            if matches_any "$file" "${global_heavy_lane_patterns[@]}"; then
              run_revocation=true
              run_integration_demo_contract=true
              run_integration_protocol=true
              # Global heavy changes short-circuit the narrower package matchers.
              continue
            fi

            case "$file" in
              *.md|docs/*)
                continue
                ;;
            esac

            if matches_any "$file" "${revocation_patterns[@]}"; then
              run_revocation=true
            fi

            if matches_any "$file" "${integration_demo_contract_patterns[@]}"; then
              run_integration_demo_contract=true
            fi

            if matches_any "$file" "${integration_protocol_patterns[@]}"; then
              run_integration_protocol=true
            fi
          done

          if [[ "$docs_related" != true ]]; then
            docs_only=false
          fi

          if [[ "$bdd_related" != true ]]; then
            bdd_only=false
          fi

          if [[ "$bdd_only" == true ]]; then
            docs_only=false
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "bdd_only=$bdd_only" >> "$GITHUB_OUTPUT"
          echo "run_revocation=$run_revocation" >> "$GITHUB_OUTPUT"
          echo "run_integration_demo_contract=$run_integration_demo_contract" >> "$GITHUB_OUTPUT"
          echo "run_integration_protocol=$run_integration_protocol" >> "$GITHUB_OUTPUT"

  docs-only-validation:
    name: Docs-only Validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify docs-only diff has no whitespace issues
        run: git diff --check

      - name: Record docs-only fast path
        run: |
          echo 'Docs-only change detected.'
          echo 'Skipping Compact setup, builds, and test lanes.'

  bdd-scenarios:
    name: BDD Scenarios Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, prepare-compact]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.bdd_only == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Compact toolchain artifact
        uses: actions/download-artifact@v4
        with:
          name: compact-toolchain
          path: ${{ runner.temp }}/compact-toolchain

      - name: Restore Compact toolchain
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share" "$HOME/.config" "$HOME/.compact"
          tar -C "$HOME" -xzf "$RUNNER_TEMP/compact-toolchain/compact-toolchain.tar.gz"
          mkdir -p "$HOME/.local/share" "$HOME/.config" "$HOME/.compact"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Activate Compact compiler
        shell: bash
        run: |
          if compact compile --version >/dev/null 2>&1; then
            exit 0
          fi
          if [ "$COMPACT_COMPILER_VERSION" = "latest" ]; then
            compact update
          else
            compact update "$COMPACT_COMPILER_VERSION" || compact update
          fi

      - name: Verify Compact installation
        run: |
          compact compile --version

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run BDD smoke lane
        run: npm run test:bdd:smoke

  prepare-compact:
    name: Prepare Compact Toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Set up Compact toolchain
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Verify Compact installation
        run: compact compile --version

      - name: Pack Compact toolchain
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/compact-toolchain"
          compact_paths=(.local/bin/compact)
          if [ -d "$HOME/.compact" ]; then
            compact_paths+=(.compact)
          fi
          if [ -d "$HOME/.local/share/compact" ]; then
            compact_paths+=(.local/share/compact)
          fi
          if [ -d "$HOME/.config/compact" ]; then
            compact_paths+=(.config/compact)
          fi
          tar -C "$HOME" -czf "$RUNNER_TEMP/compact-toolchain/compact-toolchain.tar.gz" "${compact_paths[@]}"

      - name: Upload Compact toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: compact-toolchain
          path: ${{ runner.temp }}/compact-toolchain/compact-toolchain.tar.gz
          if-no-files-found: error

  build-artifacts:
    name: Build Shared Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [changes, prepare-compact]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.bdd_only != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute build input hash
        id: build-input-hash
        shell: bash
        run: |
          echo "hash=$(./tooling/scripts/hash-ci-build-inputs.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore cached build outputs
        id: restore-build-output-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            credentials/src/managed
            credentials/dist
            credentials-status-registry/src/managed
            credentials-status-registry/dist
            credentials-same-holder/src/managed
            credentials-same-holder/dist
            credentials-iso-registry/src/managed
            credentials-iso-registry/dist
            credentials-birth/src/managed
            credentials-birth/dist
            credentials-birth-secret/src/managed
            credentials-birth-secret/dist
            use-cases/age-gate/contract/src/managed
            use-cases/age-gate/contract/dist
            components/adapters/offchain-did/dist
            protocols/openid/dist
            components/orchestration/protocol/dist
          key: ${{ runner.os }}-ci-build-outputs-${{ env.COMPACT_COMPILER_VERSION }}-${{ steps.build-input-hash.outputs.hash }}

      - name: Verify cached build outputs
        id: verify-build-output-cache
        shell: bash
        run: |
          if ./tooling/scripts/verify-ci-build-outputs.sh; then
            echo "cache_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.verify-build-output-cache.outputs.cache_ready != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Compact toolchain artifact
        if: steps.verify-build-output-cache.outputs.cache_ready != 'true'
        uses: actions/download-artifact@v4
        with:
          name: compact-toolchain
          path: ${{ runner.temp }}/compact-toolchain

      - name: Restore Compact toolchain
        if: steps.verify-build-output-cache.outputs.cache_ready != 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share" "$HOME/.config" "$HOME/.compact"
          tar -C "$HOME" -xzf "$RUNNER_TEMP/compact-toolchain/compact-toolchain.tar.gz"
          mkdir -p "$HOME/.local/share" "$HOME/.config" "$HOME/.compact"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Activate Compact compiler
        if: steps.verify-build-output-cache.outputs.cache_ready != 'true'
        shell: bash
        run: |
          if compact compile --version >/dev/null 2>&1; then
            exit 0
          fi
          if [ "$COMPACT_COMPILER_VERSION" = "latest" ]; then
            compact update
          else
            compact update "$COMPACT_COMPILER_VERSION" || compact update
          fi

      - name: Verify Compact installation
        if: steps.verify-build-output-cache.outputs.cache_ready != 'true'
        run: |
          compact compile --version

      - name: Install dependencies
        if: steps.verify-build-output-cache.outputs.cache_ready != 'true'
        run: npm ci --prefer-offline

      - name: Restore turbo cache
        if: steps.verify-build-output-cache.outputs.cache_ready != 'true'
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('package-lock.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
            ${{ runner.os }}-turbo-

      - name: Build reusable CI artifacts
        if: steps.verify-build-output-cache.outputs.cache_ready != 'true'
        run: npm run build:ci-artifacts

      - name: Save cached build outputs
        if: steps.verify-build-output-cache.outputs.cache_ready != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            credentials/src/managed
            credentials/dist
            credentials-status-registry/src/managed
            credentials-status-registry/dist
            credentials-same-holder/src/managed
            credentials-same-holder/dist
            credentials-iso-registry/src/managed
            credentials-iso-registry/dist
            credentials-birth/src/managed
            credentials-birth/dist
            credentials-birth-secret/src/managed
            credentials-birth-secret/dist
            use-cases/age-gate/contract/src/managed
            use-cases/age-gate/contract/dist
            components/adapters/offchain-did/dist
            protocols/openid/dist
            components/orchestration/protocol/dist
          key: ${{ runner.os }}-ci-build-outputs-${{ env.COMPACT_COMPILER_VERSION }}-${{ steps.build-input-hash.outputs.hash }}

      - name: Pack reusable CI artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/ci-build-outputs"
          ./tooling/scripts/pack-ci-build-outputs.sh \
            "$RUNNER_TEMP/ci-build-outputs"

      - name: Upload foundation CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-foundation
          path: ${{ runner.temp }}/ci-build-outputs/ci-build-foundation.tar.gz
          if-no-files-found: error

      - name: Upload birth-family CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-birth-family
          path: ${{ runner.temp }}/ci-build-outputs/ci-build-birth-family.tar.gz
          if-no-files-found: error

      - name: Upload age-gate CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-age-gate
          path: ${{ runner.temp }}/ci-build-outputs/ci-build-age-gate.tar.gz
          if-no-files-found: error

      - name: Upload protocol CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-protocol
          path: ${{ runner.temp }}/ci-build-outputs/ci-build-protocol.tar.gz
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.bdd_only != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('package-lock.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
            ${{ runner.os }}-turbo-

      - name: Run lint lane
        run: npm run ci:lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [changes, build-artifacts]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.bdd_only != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Download foundation CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-build-foundation
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download birth-family CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-build-birth-family
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download age-gate CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-build-age-gate
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download protocol CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-build-protocol
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Restore reusable CI artifacts
        run: |
          ./tooling/scripts/restore-ci-build-outputs.sh \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-foundation.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-birth-family.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-age-gate.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-protocol.tar.gz"

      - name: Run typecheck lane
        run: npm run ci:typecheck:from-artifacts

  package-tests:
    name: Build and Package Tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [changes, build-artifacts]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.bdd_only != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Download foundation CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-build-foundation
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download birth-family CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-build-birth-family
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download age-gate CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-build-age-gate
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download protocol CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-build-protocol
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Restore reusable CI artifacts
        run: |
          ./tooling/scripts/restore-ci-build-outputs.sh \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-foundation.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-birth-family.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-age-gate.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-protocol.tar.gz"

      - name: Run package build and test lane
        run: npm run ci:package-tests:from-artifacts

  revocation:
    name: Revocation Demo Lane
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [changes, build-artifacts]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.bdd_only != 'true' && needs.changes.outputs.run_revocation == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Download foundation CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-build-foundation
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download birth-family CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-build-birth-family
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download age-gate CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-build-age-gate
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Restore reusable CI artifacts
        run: |
          ./tooling/scripts/restore-ci-build-outputs.sh \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-foundation.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-birth-family.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-age-gate.tar.gz"

      - name: Run revocation-focused lane
        run: npm run ci:revocation:from-artifacts

  integration-demo-contract:
    name: "Standalone Integration: Demo Contract"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [changes, build-artifacts]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.bdd_only != 'true' && needs.changes.outputs.run_integration_demo_contract == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Download foundation CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-build-foundation
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download birth-family CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-build-birth-family
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download age-gate CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-build-age-gate
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Restore reusable CI artifacts
        run: |
          ./tooling/scripts/restore-ci-build-outputs.sh \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-foundation.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-birth-family.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-age-gate.tar.gz"

      - name: Run demo-contract integration lane
        run: npm run ci:integration:demo-contract:from-artifacts

  integration-protocol:
    name: "Standalone Integration: Protocol"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [changes, build-artifacts]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.bdd_only != 'true' && needs.changes.outputs.run_integration_protocol == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Download foundation CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-build-foundation
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download birth-family CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-build-birth-family
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download age-gate CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-build-age-gate
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download protocol CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-build-protocol
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Restore reusable CI artifacts
        run: |
          ./tooling/scripts/restore-ci-build-outputs.sh \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-foundation.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-birth-family.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-age-gate.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-protocol.tar.gz"

      - name: Run protocol integration lane
        run: npm run ci:integration:protocol:from-artifacts
