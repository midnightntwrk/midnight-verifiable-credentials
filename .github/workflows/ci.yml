  public-compact-fixtures:
    name: Restore and Validate Public Compact Fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, build-artifacts]
    if: needs.changes.outputs.docs_only != 'true' && needs.build-artifacts.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Download foundation CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-build-foundation
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download birth-family CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-build-birth-family
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download age-gate CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-build-age-gate
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download protocol CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-build-protocol
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Restore reusable CI artifacts
        run: |
          ./tooling/scripts/restore-ci-build-outputs.sh \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-foundation.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-birth-family.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-age-gate.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-protocol.tar.gz"
      - name: Restore Compact toolchain

        uses: ./.github/actions/restore-compact-toolchain
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Validate committed fixture manifest
        id: fixtures
        shell: bash
        run: |
          set -o pipefail
          if ! node ./tooling/scripts/compact-fixtures.mjs --allow-missing --require-lfs --require-hydrated | tee "$RUNNER_TEMP/compact-fixtures.json"; then
            echo 'Fixture manifest is invalid; refusing to use generated outputs.' >&2
            exit 1
          fi
          if grep -q '"fallbackRequired": true' "$RUNNER_TEMP/compact-fixtures.json"; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Test and typecheck from validated fixtures
        if: steps.fixtures.outputs.ready == 'true'
        run: |
          pnpm run test:fixtures:from-artifacts
          pnpm run typecheck:fixtures:from-artifacts

      - name: Rebuild source fallback when fixtures are unavailable
        if: steps.fixtures.outputs.ready != 'true'
        run: |
          echo 'Public fixtures are unavailable or stale; running the explicit source rebuild fallback.'
          pnpm run build:light
          pnpm run test:light:from-artifacts
          pnpm run typecheck:light:from-artifacts
