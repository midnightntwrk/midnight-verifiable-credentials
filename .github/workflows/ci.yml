name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PNPM_CONFIG_AUDIT: "false"
  PNPM_CONFIG_FUND: "false"
  COMPACT_COMPILER_VERSION: 0.30.0
  PROOF_SERVER_IMAGE: ${{ vars.PROOF_SERVER_IMAGE != '' && vars.PROOF_SERVER_IMAGE || 'midnightntwrk/proof-server:8.0.3' }}
  VC_GITHUB_DEPENDENCY_TOKEN: ${{ secrets.MIDNIGHTCI_REPO || github.token }}

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      bdd_only: ${{ steps.classify.outputs.bdd_only }}
      run_hello_smoke: ${{ steps.classify.outputs.run_hello_smoke }}
      run_revocation: ${{ steps.classify.outputs.run_revocation }}
      run_integration_demo_contract: ${{ steps.classify.outputs.run_integration_demo_contract }}
      run_integration_protocol: ${{ steps.classify.outputs.run_integration_protocol }}
      run_university: ${{ steps.classify.outputs.run_university }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify docs-only, BDD-only, and heavy-lane changes
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            range="${{ github.event.before }}...${{ github.sha }}"
          else
            range="${{ github.sha }}^...${{ github.sha }}"
          fi

          node ./tooling/scripts/ci-change-classification-catalog.mjs "$range" >> "$GITHUB_OUTPUT"

  docs-only-validation:
    name: Docs-only Validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: "false"

      - name: Verify docs-only diff has no whitespace issues
        run: git diff --check

      - name: Check markdown links
        run: pnpm run docs:links

      - name: Record docs-only fast path
        run: |
          echo 'Docs-only change detected.'
          echo 'Skipping Compact setup, builds, and test lanes.'

  bdd-scenarios:
    # Keep this check name stable for branch-protection compatibility; the run
    # step below now covers age-gate smoke plus full university BDD summaries.
    name: BDD Scenarios Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, prepare-compact]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.bdd_only == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Restore Compact toolchain
        uses: ./.github/actions/restore-compact-toolchain
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Check BDD summary artifact contract
        run: pnpm run check:bdd-summary-artifacts

      - name: Run BDD summary lanes
        shell: bash
        run: |
          pnpm run test:bdd:smoke || age_gate_status=$?
          pnpm run test:bdd:university || university_status=$?
          exit "${age_gate_status:-${university_status:-0}}"

      - name: Upload BDD summary artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bdd-summary-artifacts
          path: |
            packages/use-cases/age-gate/scenarios/target/cucumber-report.json
            packages/use-cases/age-gate/scenarios/target/summary.json
            packages/use-cases/age-gate/scenarios/target/summary.md
            packages/use-cases/university/scenarios/target/cucumber-report.json
            packages/use-cases/university/scenarios/target/summary.json
            packages/use-cases/university/scenarios/target/summary.md
          if-no-files-found: error
          retention-days: 14

  prepare-compact:
    name: Prepare Compact Toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Set up Compact toolchain
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8 # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Verify Compact installation
        run: compact compile --version

      - name: Validate trusted-time capability
        run: pnpm run test:trusted-time-capability

      - name: Pack Compact toolchain
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/compact-toolchain"
          compact_paths=(.local/bin/compact)
          if [ -d "$HOME/.compact" ]; then
            compact_paths+=(.compact)
          fi
          if [ -d "$HOME/.local/share/compact" ]; then
            compact_paths+=(.local/share/compact)
          fi
          if [ -d "$HOME/.config/compact" ]; then
            compact_paths+=(.config/compact)
          fi
          tar -C "$HOME" -czf "$RUNNER_TEMP/compact-toolchain/compact-toolchain.tar.gz" "${compact_paths[@]}"

      - name: Upload Compact toolchain artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compact-toolchain
          path: ${{ runner.temp }}/compact-toolchain/compact-toolchain.tar.gz
          if-no-files-found: error

  build-artifacts:
    name: Build Shared Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [changes, prepare-compact]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.bdd_only != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute build input hashes
        id: build-input-hashes
        shell: bash
        run: |
          echo "foundation=$(./tooling/scripts/hash-ci-build-inputs.sh foundation)" >> "$GITHUB_OUTPUT"
          echo "birth_family=$(./tooling/scripts/hash-ci-build-inputs.sh birth-family)" >> "$GITHUB_OUTPUT"
          echo "age_gate=$(./tooling/scripts/hash-ci-build-inputs.sh age-gate)" >> "$GITHUB_OUTPUT"
          echo "protocol=$(./tooling/scripts/hash-ci-build-inputs.sh protocol)" >> "$GITHUB_OUTPUT"

      - name: Compute cone output paths
        id: cone-paths
        shell: bash
        run: |
          source ./tooling/scripts/ci-build-output-groups.sh

          emit_group_output() {
            local key="$1"
            local group="$2"
            {
              echo "${key}<<EOF"
              ci_build_output_paths "$group"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          }

          emit_group_output foundation foundation
          emit_group_output birth_family birth-family
          emit_group_output age_gate age-gate
          emit_group_output protocol protocol

      - name: Restore foundation build outputs
        id: restore-foundation-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cone-paths.outputs.foundation }}
          key: ${{ runner.os }}-ci-build-foundation-${{ env.COMPACT_COMPILER_VERSION }}-${{ steps.build-input-hashes.outputs.foundation }}

      - name: Verify foundation build outputs
        id: verify-foundation-cache
        shell: bash
        run: |
          if ./tooling/scripts/verify-ci-build-outputs.sh foundation; then
            echo "cache_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore birth-family build outputs
        id: restore-birth-family-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cone-paths.outputs.birth_family }}
          key: ${{ runner.os }}-ci-build-birth-family-${{ env.COMPACT_COMPILER_VERSION }}-${{ steps.build-input-hashes.outputs.birth_family }}

      - name: Verify birth-family build outputs
        id: verify-birth-family-cache
        shell: bash
        run: |
          if ./tooling/scripts/verify-ci-build-outputs.sh birth-family; then
            echo "cache_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore age-gate build outputs
        id: restore-age-gate-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cone-paths.outputs.age_gate }}
          key: ${{ runner.os }}-ci-build-age-gate-${{ env.COMPACT_COMPILER_VERSION }}-${{ steps.build-input-hashes.outputs.age_gate }}

      - name: Verify age-gate build outputs
        id: verify-age-gate-cache
        shell: bash
        run: |
          if ./tooling/scripts/verify-ci-build-outputs.sh age-gate; then
            echo "cache_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore protocol build outputs
        id: restore-protocol-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cone-paths.outputs.protocol }}
          key: ${{ runner.os }}-ci-build-protocol-${{ env.COMPACT_COMPILER_VERSION }}-${{ steps.build-input-hashes.outputs.protocol }}

      - name: Verify protocol build outputs
        id: verify-protocol-cache
        shell: bash
        run: |
          if ./tooling/scripts/verify-ci-build-outputs.sh protocol; then
            echo "cache_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize cone cache state
        id: cone-cache
        shell: bash
        env:
          FOUNDATION_CACHE_READY: ${{ steps.verify-foundation-cache.outputs.cache_ready }}
          BIRTH_FAMILY_CACHE_READY: ${{ steps.verify-birth-family-cache.outputs.cache_ready }}
          AGE_GATE_CACHE_READY: ${{ steps.verify-age-gate-cache.outputs.cache_ready }}
          PROTOCOL_CACHE_READY: ${{ steps.verify-protocol-cache.outputs.cache_ready }}
        run: |
          if [[ "$FOUNDATION_CACHE_READY" == 'true' \
             && "$BIRTH_FAMILY_CACHE_READY" == 'true' \
             && "$AGE_GATE_CACHE_READY" == 'true' \
             && "$PROTOCOL_CACHE_READY" == 'true' ]]; then
            echo "any_missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "any_missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js, dependencies, and turbo cache
        if: steps.cone-cache.outputs.any_missing == 'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          turbo-cache: "true"

      - name: Restore Compact toolchain
        if: steps.cone-cache.outputs.any_missing == 'true'
        uses: ./.github/actions/restore-compact-toolchain
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Build foundation outputs
        if: steps.verify-foundation-cache.outputs.cache_ready != 'true'
        run: pnpm run build:cone:foundation

      - name: Build birth-family outputs
        if: steps.verify-birth-family-cache.outputs.cache_ready != 'true'
        run: pnpm run build:cone:birth-family

      - name: Build age-gate outputs
        if: steps.verify-age-gate-cache.outputs.cache_ready != 'true'
        run: pnpm run build:cone:age-gate

      - name: Build protocol outputs
        if: steps.verify-protocol-cache.outputs.cache_ready != 'true'
        run: pnpm run build:cone:protocol

      - name: Save foundation build outputs
        if: steps.verify-foundation-cache.outputs.cache_ready != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cone-paths.outputs.foundation }}
          key: ${{ runner.os }}-ci-build-foundation-${{ env.COMPACT_COMPILER_VERSION }}-${{ steps.build-input-hashes.outputs.foundation }}

      - name: Save birth-family build outputs
        if: steps.verify-birth-family-cache.outputs.cache_ready != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cone-paths.outputs.birth_family }}
          key: ${{ runner.os }}-ci-build-birth-family-${{ env.COMPACT_COMPILER_VERSION }}-${{ steps.build-input-hashes.outputs.birth_family }}

      - name: Save age-gate build outputs
        if: steps.verify-age-gate-cache.outputs.cache_ready != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cone-paths.outputs.age_gate }}
          key: ${{ runner.os }}-ci-build-age-gate-${{ env.COMPACT_COMPILER_VERSION }}-${{ steps.build-input-hashes.outputs.age_gate }}

      - name: Save protocol build outputs
        if: steps.verify-protocol-cache.outputs.cache_ready != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cone-paths.outputs.protocol }}
          key: ${{ runner.os }}-ci-build-protocol-${{ env.COMPACT_COMPILER_VERSION }}-${{ steps.build-input-hashes.outputs.protocol }}

      - name: Pack reusable CI artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/ci-build-outputs"
          ./tooling/scripts/pack-ci-build-outputs.sh \
            "$RUNNER_TEMP/ci-build-outputs"

      - name: Upload foundation CI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-build-foundation
          path: ${{ runner.temp }}/ci-build-outputs/ci-build-foundation.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Upload birth-family CI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-build-birth-family
          path: ${{ runner.temp }}/ci-build-outputs/ci-build-birth-family.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Upload age-gate CI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-build-age-gate
          path: ${{ runner.temp }}/ci-build-outputs/ci-build-age-gate.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Upload protocol CI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-build-protocol
          path: ${{ runner.temp }}/ci-build-outputs/ci-build-protocol.tar.gz
          if-no-files-found: error
          compression-level: 0

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.bdd_only != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js, dependencies, and turbo cache
        uses: ./.github/actions/setup-node-pnpm
        with:
          turbo-cache: "true"

      - name: Run lint lane
        run: pnpm run ci:lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [changes, build-artifacts]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.bdd_only != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Download foundation CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-build-foundation
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download birth-family CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-build-birth-family
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download age-gate CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-build-age-gate
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download protocol CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-build-protocol
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Restore reusable CI artifacts
        run: |
          ./tooling/scripts/restore-ci-build-outputs.sh \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-foundation.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-birth-family.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-age-gate.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-protocol.tar.gz"

      - name: Run typecheck lane
        run: pnpm run ci:typecheck:from-artifacts

  package-tests:
    name: Build and Package Tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [changes, build-artifacts]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.bdd_only != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Restore Compact toolchain
        uses: ./.github/actions/restore-compact-toolchain
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Download foundation CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-build-foundation
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download birth-family CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-build-birth-family
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download age-gate CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-build-age-gate
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download protocol CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-build-protocol
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Restore reusable CI artifacts
        run: |
          ./tooling/scripts/restore-ci-build-outputs.sh \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-foundation.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-birth-family.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-age-gate.tar.gz" \
            "$RUNNER_TEMP/ci-build-outputs/ci-build-protocol.tar.gz"

      - name: Run package build and test lane
        run: pnpm run ci:package-tests:from-artifacts

  university-validation:
    name: University Validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, prepare-compact]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.bdd_only != 'true' && needs.changes.outputs.run_university == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Restore Compact toolchain
        uses: ./.github/actions/restore-compact-toolchain
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Run university profile lanes
        run: pnpm run ci:university-protocol-profiles

      - name: Upload university protocol profile artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: university-protocol-targets
          path: |
            packages/use-cases/university/protocol/target/cohort-30
            packages/use-cases/university/protocol/target/stress-100
          if-no-files-found: warn

  hello-smoke:
    name: Hello Smoke Lane
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, build-artifacts]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.bdd_only != 'true' && needs.changes.outputs.run_hello_smoke == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Restore Compact toolchain
        uses: ./.github/actions/restore-compact-toolchain
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Download foundation CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-build-foundation
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download birth-family CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-build-birth-family
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Download age-gate CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-build-age-gate
          path: ${{ runner.temp }}/ci-build-outputs

      - name: Restore reusable CI artifacts
        run: |
          ./tooling/scripts/restore-ci-build-outputs.sh \
