name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  COMPACT_COMPILER_VERSION: 0.30.0
  PROOF_SERVER_IMAGE: ${{ vars.PROOF_SERVER_IMAGE != '' && vars.PROOF_SERVER_IMAGE || 'midnightntwrk/proof-server:8.0.3' }}

jobs:
  build:
    name: Build, Lint, Typecheck, and Package Tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Compact toolchain
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Verify Compact installation
        run: compact compile --version

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run CI build lane
        run: npm run ci:build

  integration-test:
    name: Standalone Integration Tests
    runs-on: ubuntu-latest
    needs:
      - build
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Compact toolchain
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Verify Compact installation
        run: compact compile --version

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run standalone integration lane
        run: npm run ci:integration
