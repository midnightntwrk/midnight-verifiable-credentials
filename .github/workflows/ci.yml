name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - vc-core
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PNPM_CONFIG_AUDIT: "false"
  PNPM_CONFIG_FUND: "false"
  COMPACT_COMPILER_VERSION: 0.31.1

jobs:
  core-validation:
    name: Core Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm
        with:
          turbo-cache: "true"

      - name: Set up Compact toolchain
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8 # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Verify Compact installation
        run: compact compile --version

      - name: Run core-only release gate
        run: ./run.sh --light

      - name: Check documentation links
        run: pnpm run docs:links
