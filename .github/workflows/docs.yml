name: Docs

on:
  push:
    branches: [develop, main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs-site/**"
      - "docs/**"
      - "spec/**"
      - "conformance/**"
      - "packages/core/**/README.md"
      - "packages/core/**/CHANGELOG.md"
      - "SECURITY.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "run.sh"
  pull_request:
    branches: [develop, main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs-site/**"
      - "docs/**"
      - "spec/**"
      - "conformance/**"
      - "packages/core/**/README.md"
      - "packages/core/**/CHANGELOG.md"
      - "SECURITY.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "run.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docs Site
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.23.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify GitHub Pages configuration
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          if [ "${build_type}" != "workflow" ]; then
            echo "::error::GitHub Pages build_type is '${build_type}', expected 'workflow'."
            exit 1
          fi

      - name: Configure GitHub Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Validate documentation
        run: pnpm run docs:validate

      - name: Build documentation
        run: pnpm run docs:build

      - name: Upload Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/.vitepress/dist

  deploy:
    name: Deploy Docs Site
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Smoke test published site
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for path in "" "guide/" "spec/" "conformance/" "packages/compact"; do
            curl --fail --silent --show-error --location \
              --retry 12 --retry-delay 5 --retry-all-errors \
              "${PAGES_URL%/}/${path}" >/dev/null
          done

      - name: Checkout link checker configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .linkinatorrc.json
            .nvmrc
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.23.0
          run_install: false

      - name: Check published links
        env:
          DOCS_SITE_URL: ${{ steps.deployment.outputs.page_url }}
          LINKINATOR_VERSION: 8.0.1
        run: |
          pnpm dlx "linkinator@${LINKINATOR_VERSION}" \
            "${DOCS_SITE_URL}" \
            --config .linkinatorrc.json
