name: Published Docs Links

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Published Docs Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL != '' && vars.DOCS_SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      LINKINATOR_VERSION: 8.0.1
    steps:
      - name: Checkout link checker configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .linkinatorrc.json
            .nvmrc
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.23.0
          run_install: false

      - name: Check published links
        run: |
          pnpm dlx "linkinator@${LINKINATOR_VERSION}" \
            "${DOCS_SITE_URL}" \
            --config .linkinatorrc.json
