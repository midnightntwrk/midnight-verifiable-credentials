name: Scan
permissions: {}

on:
  push:
    branches: [develop, main, "milestone-*", "release/**"]
  pull_request:
    branches: [develop, main, "milestone-*", "release/**"]
  workflow_dispatch: {}   # so you can still run it manually
  schedule:
    - cron: '0 0 * * *'   # run daily at midnight UTC
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (startsWith(github.ref, 'refs/heads/milestone-') && format('{0}-{1}-{2}', github.event_name, github.ref, github.sha)) || github.ref_name }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan code
        uses: midnightntwrk/upload-sarif-github-action@816cd32eca4455557a762aa732c55f4eb8c99a04 # includes differential severity gate and current scanners
        with:
          fail_severity: "high"
          skip_scorecard_scan: "true"

      - name: Verify required scanner reports
        shell: bash
        run: |
          reports=(
            checkov.sarif
            gitleaks.sarif
            opengrep.sarif
            trivy.sarif
            zizmor.sarif
          )
          missing=()
          for report in "${reports[@]}"; do
            if [[ ! -s "scan_reports/${report}" ]]; then
              missing+=("${report}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required scanner report: %s\n' "${missing[@]}" >&2
            exit 1
          fi
