packages:
  - packages/core/model
  - packages/core/compact
  - packages/credential-did-midnight
  - docs-site

allowBuilds:
  # Root and clean-consumer fixtures intentionally use different esbuild
  # versions; lockfile integrity and release-age policy govern the version.
  esbuild: true
dangerouslyAllowAllBuilds: false
engineStrict: true
pmOnFail: error
strictDepBuilds: true
verifyStoreIntegrity: true

overrides:
  algoliasearch: 5.52.1
  brace-expansion@1: 5.0.12
  brace-expansion@2: 5.0.12
  brace-expansion@5: 5.0.12
  js-yaml: 4.3.2
  postcss: 8.5.23
  # Patch-only high-advisory remediation; no intake-policy exception.
  source-map-js: 1.2.2
  vite: 7.3.7

blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: false
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  # Issue 754 maintainer-approved RC1 intake; remove 2026-11-22 UTC.
  # https://github.com/midnightntwrk/midnight-verifiable-credentials/issues/754#issuecomment-6912714331
  - "@midnight-ntwrk/midnight-did@1.0.0-rc1"
  - "@midnight-ntwrk/midnight-did-contract@1.0.0-rc1"
  - "@midnight-ntwrk/midnight-did-domain@1.0.0-rc1"
  - "@midnight-ntwrk/midnight-did-jubjub-schnorr@1.0.0-rc1"
  # Remove after 2026-10-03; develop already locked this before the cooldown.
  - "@types/node@26.6.3"
  # Remove after 2026-10-05, once this release train is at least seven days old.
  - "@turbo/darwin-64@2.11.5"
  - "@turbo/darwin-arm64@2.11.5"
  - "@turbo/linux-64@2.11.5"
  - "@turbo/linux-arm64@2.11.5"
  - "@turbo/windows-64@2.11.5"
  - "@turbo/windows-arm64@2.11.5"
  - turbo@2.11.5
trustPolicy: no-downgrade
trustLockfile: false
