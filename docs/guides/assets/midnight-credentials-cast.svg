<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Midnight Credentials Cast</title>
  <desc id="desc">Simple cast diagram for the Midnight Credentials guide.</desc>
  <style>
    .bg { fill: #f6f3ea; }
    .card { fill: #fffdf8; stroke: #2f3b35; stroke-width: 2; rx: 14; }
    .title { font: 700 28px Georgia, serif; fill: #223028; }
    .name { font: 700 20px Georgia, serif; fill: #223028; }
    .body { font: 16px Georgia, serif; fill: #38453f; }
    .line { stroke: #7f8e85; stroke-width: 2; }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="300" rx="18"/>
  <text class="title" x="40" y="42">The Midnight Credentials Cast</text>
  <g transform="translate(40,70)">
    <rect class="card" x="0" y="0" width="165" height="170"/>
    <text class="name" x="18" y="34">Alice</text>
    <text class="body" x="18" y="64">Holder</text>
    <text class="body" x="18" y="92">Proves what matters</text>
    <text class="body" x="18" y="116">without oversharing.</text>
  </g>
  <g transform="translate(225,70)">
    <rect class="card" x="0" y="0" width="165" height="170"/>
    <text class="name" x="18" y="34">Rita</text>
    <text class="body" x="18" y="64">Issuer</text>
    <text class="body" x="18" y="92">Attests source facts</text>
    <text class="body" x="18" y="116">accurately.</text>
  </g>
  <g transform="translate(410,70)">
    <rect class="card" x="0" y="0" width="165" height="170"/>
    <text class="name" x="18" y="34">Vera</text>
    <text class="body" x="18" y="64">Verifier</text>
    <text class="body" x="18" y="92">Accepts only valid</text>
    <text class="body" x="18" y="116">proofs for this request.</text>
  </g>
  <g transform="translate(595,70)">
    <rect class="card" x="0" y="0" width="165" height="170"/>
    <text class="name" x="18" y="34">Bob</text>
    <text class="body" x="18" y="64">Counter-example</text>
    <text class="body" x="18" y="92">Helps expose edge</text>
    <text class="body" x="18" y="116">cases and bad flows.</text>
  </g>
  <g transform="translate(780,70)">
    <rect class="card" x="0" y="0" width="140" height="170"/>
    <text class="name" x="18" y="34">Mohawk</text>
    <text class="body" x="18" y="64">Engineer</text>
    <text class="body" x="18" y="92">Tracks leaks, replay,</text>
    <text class="body" x="18" y="116">and bad abstractions.</text>
  </g>
  <line class="line" x1="205" y1="155" x2="225" y2="155"/>
  <line class="line" x1="390" y1="155" x2="410" y2="155"/>
  <line class="line" x1="575" y1="155" x2="595" y2="155"/>
  <line class="line" x1="760" y1="155" x2="780" y2="155"/>
</svg>
