<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Midnight Privacy Drama</title>
  <desc id="desc">Simple diagram showing oversharing versus selective disclosure.</desc>
  <style>
    .bg { fill: #f7f4ec; }
    .panel { fill: #fffdf8; stroke: #2f3b35; stroke-width: 2; rx: 16; }
    .title { font: 700 26px Georgia, serif; fill: #243129; }
    .sub { font: 700 18px Georgia, serif; fill: #243129; }
    .body { font: 16px Georgia, serif; fill: #3e4a43; }
    .bad { fill: #b14444; }
    .good { fill: #2d7a59; }
    .arrow { stroke: #7b8a82; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7b8a82"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="320" rx="18"/>
  <text class="title" x="40" y="42">Alice realizes the privacy problem</text>
  <g transform="translate(40,72)">
    <rect class="panel" x="0" y="0" width="390" height="200"/>
    <text class="sub bad" x="22" y="34">Oversharing request</text>
    <text class="body" x="22" y="70">Verifier asks for:</text>
    <text class="body" x="42" y="100">• full birth date</text>
    <text class="body" x="42" y="126">• legal name</text>
    <text class="body" x="42" y="152">• birth country</text>
    <text class="body" x="22" y="184">Alice can answer, but reveals too much.</text>
  </g>
  <g transform="translate(530,72)">
    <rect class="panel" x="0" y="0" width="390" height="200"/>
    <text class="sub good" x="22" y="34">Selective / predicate request</text>
    <text class="body" x="22" y="70">Verifier asks for:</text>
    <text class="body" x="42" y="100">• age ≥ threshold</text>
    <text class="body" x="42" y="126">• optional pairwise pseudonym</text>
    <text class="body" x="42" y="152">• only the minimum disclosure needed</text>
    <text class="body" x="22" y="184">Mohawk approves this much more strongly.</text>
  </g>
  <line class="arrow" x1="430" y1="172" x2="530" y2="172"/>
</svg>
